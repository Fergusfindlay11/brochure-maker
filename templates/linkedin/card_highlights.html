<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>{{ css }}</style>
</head>
<body>
<div class="li-card li-highlights">
  <div class="li-texture"></div>
  <div class="li-header-bar">
    <div class="li-logo-grid li-logo-sm">
      <span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span>
    </div>
    <span class="li-header-name">{{ header_name }}</span>
  </div>
  <h2 class="li-section-title">Key Features</h2>
  <div class="li-features-grid">
    {% for feature in features %}
    <div class="li-feature">
      <div class="li-feature-icon">{{ feature.icon_svg }}</div>
      <div class="li-feature-divider"></div>
      <div class="li-feature-text">{{ feature.text }}</div>
    </div>
    {% endfor %}
  </div>
</div>
</body>
</html>
